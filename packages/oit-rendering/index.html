<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OIT Rendering - Zephyr3D example</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#26384a;color:#f8fafc;font:14px system-ui,sans-serif}canvas{position:absolute;width:100%;height:100%}.panel{position:absolute;z-index:2;left:16px;top:16px;max-width:calc(100vw - 32px);padding:12px;border:1px solid #94a3b8;border-radius:8px;background:#172536ee;backdrop-filter:blur(8px)}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.row:last-child{margin:0}button{min-height:30px;padding:4px 9px;border:1px solid #94a3b8;border-radius:5px;background:#334155;color:#f8fafc;cursor:pointer}button.active{border-color:#67e8f9;background:#0369a1}button:disabled{opacity:.4;cursor:not-allowed}label{display:flex;gap:7px;align-items:center;margin-right:8px}input{accent-color:#22d3ee}.status{color:#cffafe;line-height:1.5}</style></head><body><div class="panel"><div class="row"><button id="mode-none">None</button><button id="mode-weighted">Weighted</button><button id="mode-abuffer">PPLL / ABuffer</button><button id="mode-dual-depth">Dual Depth</button></div><div class="row"><label>Layers <input id="layers" type="range" min="2" max="30" value="30"><output id="layers-value">30</output></label><label><input id="animate" type="checkbox" checked> Animate</label></div><div class="status" id="status"></div></div><canvas id="canvas"></canvas><script type="module" src="js/main.js"></script></body></html>
