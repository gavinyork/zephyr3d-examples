<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RenderGraph Profiling - Zephyr3d example</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
      }
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      // Select the engine depth convention before any engine module loads.
      const params = new URLSearchParams(location.search);
      if (params.has('standardZ')) {
        globalThis.__ZEPHYR3D_REVERSE_Z__ = false;
      } else if (params.has('reverseZ')) {
        globalThis.__ZEPHYR3D_REVERSE_Z__ = true;
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
