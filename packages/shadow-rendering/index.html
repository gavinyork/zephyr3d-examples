<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Rendering - Zephyr3D example</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #111827;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
      }
      .panel {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 2;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        max-width: min(760px, calc(100vw - 32px));
        padding: 10px;
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(10px);
      }
      button {
        min-height: 32px;
        padding: 5px 10px;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #1f2937;
        color: #e5e7eb;
        cursor: pointer;
      }
      button.active {
        border-color: #60a5fa;
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <button id="mode-hard">Hard</button>
      <button id="mode-pcf">PCF</button>
      <button id="mode-pcf-opt" class="active">PCF Opt</button>
      <button id="mode-pcss">PCSS</button>
      <button id="mode-vsm">VSM</button>
      <button id="toggle-shadow" class="active">Shadows On</button>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
