<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zephyr3D Car Demo</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #16181d;
        color: #e9edf2;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 12px 16px;
        background: rgba(24, 28, 34, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        user-select: none;
      }

      #speed {
        font-size: 40px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        min-width: 92px;
        text-align: right;
      }

      #speed-unit {
        font-size: 14px;
        color: #9fb0c0;
        padding-bottom: 4px;
      }

      #hint {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.5;
        color: #cbd5df;
        background: rgba(24, 28, 34, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        user-select: none;
      }

      #hint b {
        color: #eef2f7;
      }

      #loading {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: #9fb0c0;
        background: #16181d;
      }
    </style>
  </head>
  <body>
    <div id="hint"><b>WASD</b> / Arrow keys to drive &nbsp;·&nbsp; <b>Space</b> handbrake</div>
    <div id="hud">
      <div id="speed">0</div>
      <div id="speed-unit">km/h</div>
    </div>
    <div id="loading">Loading…</div>
    <canvas id="canvas"></canvas>
    <script>
      // Select the engine depth convention before any engine module loads.
      const params = new URLSearchParams(location.search);
      if (params.has('standardZ')) {
        globalThis.__ZEPHYR3D_REVERSE_Z__ = false;
      } else if (params.has('reverseZ')) {
        globalThis.__ZEPHYR3D_REVERSE_Z__ = true;
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
